[package]
name = "diskern-cli"
description = "CLI for the Diskern engine — scan and report from the terminal."
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "diskern"
path = "src/main.rs"

[dependencies]
diskern-core = { path = "../diskern-core" }
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
