[package]
name = "diskern-core"
description = "Diskern engine: filesystem scanning, dedup detection, risk classification. Pure library — no UI, no network (except the optional `ai` feature)."
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# AI narration layer (BYO-key LLM APIs / local Ollama). The engine works fully without it.
ai = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
blake3.workspace = true
jwalk.workspace = true
rayon.workspace = true
petgraph.workspace = true
dashmap.workspace = true
globset.workspace = true

[dev-dependencies]
tempfile = "3"
