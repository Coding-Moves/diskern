version: 2
updates:
  # Version updates only. Dependabot *security* updates are a repository
  # setting, not config — see docs/DEPENDENCY-AUTOMATION.md. They ignore
  # `groups` and arrive one advisory per PR, which is what you want when
  # the PR needs to be merged on its own schedule.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies, rust]
    assignees: [Muawiya-contact]
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      # Majors that must move together — one PR per family, so a react or
      # vite major never arrives as two mutually-red halves again.
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      vite:
        patterns: ["vite", "@vitejs/*"]
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      vite:
        patterns: ["vite", "@vitejs/*"]
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
