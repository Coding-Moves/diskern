version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      # Majors that must move together — one PR per family, so a react or
      # vite major never arrives as two mutually-red halves again.
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      vite:
        patterns: ["vite", "@vitejs/*"]
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      vite:
        patterns: ["vite", "@vitejs/*"]
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
